name: Uppdatera NHL-schema

on:
  schedule:
    - cron: '20 9 * * *'   # varje dag 09:20 UTC
  workflow_dispatch:        # går att köra manuellt från Actions-fliken

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hämta schemat
        run: node scripts/fetch-schedule.mjs

      - name: Committa om något ändrats
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Uppdatera schema $(date -u +%F)"
            git push
          fi
